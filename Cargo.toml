[package]
name = "charming-lipgloss"
version = "2.0.6"
edition = "2021"
description = "Cleanroom Rust port of Charmbracelet's Lip Gloss (v2.0.5) terminal styling library"
license = "MIT"

[dependencies]
charming-colorprofile = { version = "0.4.4", path = "../charming-colorprofile" }
charming-ultraviolet = { version = "0.0.0-20260812000000", path = "../charming-ultraviolet" }
charming-x-ansi = { version = "0.0.0-20260812000000", path = "../charming-x-ansi" }
unicode-segmentation = "1.10.1"
unicode-width = "0.1"
libc = "0.2"

[dev-dependencies]

[lib]
name = "charming_lipgloss"
path = "src/lib.rs"
