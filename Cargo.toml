[workspace]
resolver = "2"

[package]
name = "rusty-lipgloss"
exclude = ["POLICIES.md"]
version = "2.0.5"
edition = "2021"
rust-version = "1.98.0"
description = "Cleanroom Rust port of Charmbracelet's Lip Gloss (v2.0.5) terminal styling library"
license = "MIT"

[dependencies]
rusty-colorprofile = { version = "0.4.3", path = "../rusty-colorprofile" }
rusty-ultraviolet = { version = "0.0.0-20260703014108-f5a850f9c2b7", path = "../rusty-ultraviolet" }
rusty-x-ansi = { version = "0.11.7", path = "../rusty-x-ansi" }
unicode-segmentation = "1.10.1"
unicode-width = "0.1"
libc = "0.2"

[dev-dependencies]

[lib]
name = "rusty_lipgloss"
path = "src/lib.rs"
