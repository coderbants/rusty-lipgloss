name: CI

# Gate for all PRs to the live branch (`dev`): merges are rejected unless
# every lint, build, docgen and test (including all integration tests)
# passes 100%, and unless the merge carries a version change (releases on
# crates.io cannot be overwritten in place, so every merge to the live
# branch must be accompanied by a new tagged version).

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  version-bump:
    name: Version Change Required
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify version matches upstream
        run: scripts/verify_upstream_version.sh
  gate:
    name: Lint / Build / Doc / Tests
    runs-on: ubuntu-latest
    needs: version-bump
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt
      - name: Configure shared Cargo cache
        run: |
          # The runner image pre-sets CARGO_HOME=$HOME/.cargo; drop the
          # ambient value so the shared-cache defaults apply (the resolver
          # rejects it as an uncontained override otherwise).
          unset CARGO_HOME
          . scripts/cargo-env.sh
          configure_shared_cargo_cache_environment
          {
            echo "CARGO_SHARED_CACHE_DIRECTORY=$CARGO_SHARED_CACHE_DIRECTORY"
            echo "CARGO_HOME=$CARGO_HOME"
            echo "CARGO_TARGET_DIR=$CARGO_TARGET_DIR"
            echo "CARGO_BUILD_BUILD_DIR=$CARGO_BUILD_BUILD_DIR"
            echo "CARGO_INSTALL_ROOT=$CARGO_INSTALL_ROOT"
          } >> "$GITHUB_ENV"
      - name: Test shared Cargo cache env
        run: scripts/test-cargo-env.sh
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Fetch upstream Go source (pinned)
        run: |
          git clone --quiet https://github.com/charmbracelet/lipgloss.git upstream-go
          cd upstream-go && git checkout --quiet v2.0.5
      - name: Test mapping verifier contract
        run: scripts/verify_mapping_test.sh
      - name: Verify upstream mapping
        run: scripts/verify_mapping.sh
      - name: Fetch sibling rusty-bubbletea (pinned)
        uses: actions/checkout@v4
        with:
          repository: coderbants/rusty-bubbletea
          path: siblings/rusty-bubbletea
          ref: e52c130025cd28e00595b1302e61142d373cec22
      - name: Fetch sibling rusty-bubbles (pinned)
        uses: actions/checkout@v4
        with:
          repository: coderbants/rusty-bubbles
          path: siblings/rusty-bubbles
          ref: 2a88f46cb8179388adb1951adb0f4fdbdcd633c0
      - name: Fetch sibling rusty-colorprofile (pinned)
        uses: actions/checkout@v4
        with:
          repository: coderbants/rusty-colorprofile
          path: siblings/rusty-colorprofile
          ref: 9b31a0fa223fe5570bd8ba26102013459b3558cc
      - name: Fetch sibling rusty-testkit (pinned)
        uses: actions/checkout@v4
        with:
          repository: coderbants/rusty-testkit
          path: siblings/rusty-testkit
          ref: 95aea2b636f6d479c757bb33957bb25a734a09fb
      - name: Fetch sibling rusty-ultraviolet (pinned)
        uses: actions/checkout@v4
        with:
          repository: coderbants/rusty-ultraviolet
          path: siblings/rusty-ultraviolet
          ref: 6b9fb160a08f9291f63a82c568bf576079713246
      - name: Fetch sibling rusty-x-ansi (pinned)
        uses: actions/checkout@v4
        with:
          repository: coderbants/rusty-x-ansi
          path: siblings/rusty-x-ansi
          ref: ed192c185a23ab8faeef5a43cb37b36ce07ff77d
      - name: Place sibling crates
        run: |
          mkdir -p ../siblings && true
          mv siblings/rusty-bubbletea ../rusty-bubbletea
          mv siblings/rusty-bubbles ../rusty-bubbles
          mv siblings/rusty-colorprofile ../rusty-colorprofile
          mv siblings/rusty-testkit ../rusty-testkit
          mv siblings/rusty-ultraviolet ../rusty-ultraviolet
          mv siblings/rusty-x-ansi ../rusty-x-ansi
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build --all-targets
      - name: Docgen
        run: cargo doc --no-deps
      - name: Test (all targets, all integration tests)
        run: cargo test --all-targets
  windows-safe-fallback:
    name: Windows safe fallback
    runs-on: windows-latest
    needs: version-bump
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Fetch sibling rusty-colorprofile
        uses: actions/checkout@v4
        with:
          repository: coderbants/rusty-colorprofile
          path: siblings/rusty-colorprofile
          ref: 9b31a0fa223fe5570bd8ba26102013459b3558cc
      - name: Fetch sibling rusty-ultraviolet
        uses: actions/checkout@v4
        with:
          repository: coderbants/rusty-ultraviolet
          path: siblings/rusty-ultraviolet
          # Exact compile-safe Windows dependency candidate from PR #3.
          ref: 6b9fb160a08f9291f63a82c568bf576079713246
      - name: Fetch sibling rusty-x-ansi
        uses: actions/checkout@v4
        with:
          repository: coderbants/rusty-x-ansi
          path: siblings/rusty-x-ansi
          ref: ed192c185a23ab8faeef5a43cb37b36ce07ff77d
      - name: Place sibling crates
        run: |
          rm -rf ../rusty-colorprofile ../rusty-ultraviolet ../rusty-x-ansi
          mv siblings/rusty-colorprofile ../rusty-colorprofile
          mv siblings/rusty-ultraviolet ../rusty-ultraviolet
          mv siblings/rusty-x-ansi ../rusty-x-ansi
      - name: Exercise Windows safe fallback
        run: cargo test --lib platform::tests::windows_ansi_entrypoint_is_safe_until_native_adapter_exists --no-fail-fast
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Configure shared Cargo cache
        run: |
          # The runner image pre-sets CARGO_HOME=$HOME/.cargo; drop the
          # ambient value so the shared-cache defaults apply.
          unset CARGO_HOME
          . scripts/cargo-env.sh
          configure_shared_cargo_cache_environment
          {
            echo "CARGO_SHARED_CACHE_DIRECTORY=$CARGO_SHARED_CACHE_DIRECTORY"
            echo "CARGO_HOME=$CARGO_HOME"
            echo "CARGO_TARGET_DIR=$CARGO_TARGET_DIR"
            echo "CARGO_BUILD_BUILD_DIR=$CARGO_BUILD_BUILD_DIR"
            echo "CARGO_INSTALL_ROOT=$CARGO_INSTALL_ROOT"
          } >> "$GITHUB_ENV"
      - name: Fetch sibling rusty-bubbletea (pinned)
        uses: actions/checkout@v4
        with:
          repository: coderbants/rusty-bubbletea
          path: siblings/rusty-bubbletea
          ref: e52c130025cd28e00595b1302e61142d373cec22
      - name: Fetch sibling rusty-bubbles (pinned)
        uses: actions/checkout@v4
        with:
          repository: coderbants/rusty-bubbles
          path: siblings/rusty-bubbles
          ref: 2a88f46cb8179388adb1951adb0f4fdbdcd633c0
      - name: Fetch sibling rusty-colorprofile (pinned)
        uses: actions/checkout@v4
        with:
          repository: coderbants/rusty-colorprofile
          path: siblings/rusty-colorprofile
          ref: 9b31a0fa223fe5570bd8ba26102013459b3558cc
      - name: Fetch sibling rusty-testkit (pinned)
        uses: actions/checkout@v4
        with:
          repository: coderbants/rusty-testkit
          path: siblings/rusty-testkit
          ref: 95aea2b636f6d479c757bb33957bb25a734a09fb
      - name: Fetch sibling rusty-ultraviolet (pinned)
        uses: actions/checkout@v4
        with:
          repository: coderbants/rusty-ultraviolet
          path: siblings/rusty-ultraviolet
          ref: 6b9fb160a08f9291f63a82c568bf576079713246
      - name: Fetch sibling rusty-x-ansi (pinned)
        uses: actions/checkout@v4
        with:
          repository: coderbants/rusty-x-ansi
          path: siblings/rusty-x-ansi
          ref: ed192c185a23ab8faeef5a43cb37b36ce07ff77d
      - name: Place sibling crates
        run: |
          mkdir -p ../siblings && true
          mv siblings/rusty-bubbletea ../rusty-bubbletea
          mv siblings/rusty-bubbles ../rusty-bubbles
          mv siblings/rusty-colorprofile ../rusty-colorprofile
          mv siblings/rusty-testkit ../rusty-testkit
          mv siblings/rusty-ultraviolet ../rusty-ultraviolet
          mv siblings/rusty-x-ansi ../rusty-x-ansi
      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@cargo-tarpaulin
      - name: Generate code coverage
        run: |
          cargo tarpaulin --all-features --out xml --output-dir target/tarpaulin -- --test-threads=1 2>&1 | tee /tmp/tarpaulin.log
